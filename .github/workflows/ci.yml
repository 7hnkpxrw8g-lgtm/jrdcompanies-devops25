name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API · pytest + ruff
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jrd
          POSTGRES_PASSWORD: jrd
          POSTGRES_DB: jrdbooks
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e '.[dev]'
          pip install 'bcrypt<4.1'
      - name: Lint
        run: ruff check src tests
      - name: Migrations
        env:
          DATABASE_URL: postgresql+psycopg://jrd:jrd@localhost:5432/jrdbooks
        run: alembic upgrade head
      - name: Tests
        run: pytest -q

  web:
    name: Web · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm build
